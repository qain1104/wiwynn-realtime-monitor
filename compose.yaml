services:
  db:
    image: mariadb:11.7
    environment:
      MARIADB_DATABASE: ${DB_NAME:-monitor}
      MARIADB_USER: ${DB_USER:-monitor}
      MARIADB_PASSWORD: ${DB_PASSWORD:-localpassword}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-localrootpassword}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      retries: 20
  api:
    build:
      context: ./backend
    env_file: .env
    environment:
      DATABASE_URL: mysql+asyncmy://${DB_USER:-monitor}:${DB_PASSWORD:-localpassword}@db:3306/${DB_NAME:-monitor}
    ports: ["8000:8000"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 3s
      retries: 10
    depends_on:
      db: {condition: service_healthy}
    command: ["sh", "-c", "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"]
  ui:
    build:
      context: ./frontend
    environment:
      API_URL: http://api:8000
      STREAMLIT_SERVER_MAX_UPLOAD_SIZE: "2"
    ports: ["8501:8501"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health')"]
      interval: 10s
      timeout: 3s
      retries: 10
    depends_on:
      api: {condition: service_healthy}
volumes:
  db_data:
